name: Android APK

on:
  push:
    paths: ['android/**', 'index.html', 'css/**', 'js/**', 'icon.svg', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk hanmogeum.apk
      # 플레이 콘솔 업로드용 AAB: 저장소 비밀 값에 업로드 키가 있을 때만 만든다
      - name: Build AAB for Play Console
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.p12" UPLOAD_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            gradle -p android bundleRelease --no-daemon
          cp android/app/build/outputs/bundle/release/app-release.aab hanmogeum.aab
          rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: hanmogeum
          path: |
            hanmogeum.apk
            hanmogeum.aab
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest hanmogeum.apk $(ls hanmogeum.aab 2>/dev/null) \
            --target "$GITHUB_SHA" \
            --title "한 모금 (빌드 #$GITHUB_RUN_NUMBER)" \
            --notes "hanmogeum.apk: 폰에 직접 설치용 / hanmogeum.aab: 플레이 콘솔 업로드용(업로드 키가 등록된 경우에만 생성)"
