name: Android APK

on:
  push:
    paths: ['android/**', 'index.html', 'css/**', 'js/**', 'icon.svg', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk hanmogeum.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hanmogeum-apk
          path: hanmogeum.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest hanmogeum.apk \
            --target "$GITHUB_SHA" \
            --title "한 모금 (빌드 #$GITHUB_RUN_NUMBER)" \
            --notes "최신 빌드입니다. hanmogeum.apk를 내려받아 설치하세요."
