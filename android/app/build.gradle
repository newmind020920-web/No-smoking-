plugins {
    id 'com.android.application'
}

// 플레이 업로드 키: CI에서만 비밀 값으로 주입된다
def uploadStore = System.getenv('UPLOAD_KEYSTORE_FILE')
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'app.hanmogeum.quit'
    compileSdk 36

    defaultConfig {
        applicationId 'app.hanmogeum.quit'
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // 직접 설치(사이드로드)용 고정 서명 키. 저장소에 공개돼 있으므로 스토어 출시에는 쓰지 않는다.
    signingConfigs {
        sideload {
            storeFile file('sideload.keystore')
            storePassword 'android'
            keyAlias 'sideload'
            keyPassword 'android'
        }
        if (uploadStore) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig uploadStore ? signingConfigs.upload : signingConfigs.sideload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
}

// 저장소 루트의 웹앱을 APK 에셋(www/)으로 복사
def webAssets = layout.buildDirectory.dir('webAssets')
tasks.register('copyWeb', Copy) {
    from('../..') {
        include 'index.html', 'icon.svg', 'css/**', 'js/**'
    }
    into webAssets.map { it.dir('www') }
}
android.sourceSets.main.assets.srcDir(webAssets)
tasks.named('preBuild') { dependsOn 'copyWeb' }
