plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'app.hanmogeum.quit'
    compileSdk 34

    defaultConfig {
        applicationId 'app.hanmogeum.quit'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }

    // 직접 설치(사이드로드)용 고정 서명 키. 저장소에 공개돼 있으므로 스토어 출시에는 쓰지 않는다.
    signingConfigs {
        sideload {
            storeFile file('sideload.keystore')
            storePassword 'android'
            keyAlias 'sideload'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
}

// 저장소 루트의 웹앱을 APK 에셋(www/)으로 복사
def webAssets = layout.buildDirectory.dir('webAssets')
tasks.register('copyWeb', Copy) {
    from('../..') {
        include 'index.html', 'icon.svg', 'css/**', 'js/**'
    }
    into webAssets.map { it.dir('www') }
}
android.sourceSets.main.assets.srcDir(webAssets)
tasks.named('preBuild') { dependsOn 'copyWeb' }
